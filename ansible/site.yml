---
- name: Harden Ubuntu 26.04 LTS and configure the central rsyslog collector
  hosts: syslog_collectors
  become: true
  gather_facts: true

  vars:
    required_ubuntu_release: "26.04.1"

  pre_tasks:
    - name: Read the exact Ubuntu point release
      ansible.builtin.slurp:
        src: /etc/os-release
      register: os_release_raw

    # VERSION_ID is only "26.04"; VERSION carries the point release, e.g. "26.04.1 LTS (Resolute Raccoon)".
    - name: Parse point release
      ansible.builtin.set_fact:
        ubuntu_point_release: >-
          {{ (os_release_raw.content | b64decode
              | regex_findall('^VERSION="?([0-9.]+)', multiline=True)
              | default(['0'], true) | first) }}

    - name: Confirm Ubuntu 26.04 LTS at the required point release
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "26.04"
          - ubuntu_point_release is version(required_ubuntu_release, ">=")
        fail_msg: >-
          This playbook targets Ubuntu {{ required_ubuntu_release }} LTS or a later 26.04 point release
          (found {{ ansible_distribution }} {{ ubuntu_point_release }}). Use the image
          Canonical:ubuntu-26_04-lts:server:latest, or run a full upgrade first.
        quiet: true

    - name: Refuse to enable the firewall without an SSH allow-list when pushing over SSH
      ansible.builtin.assert:
        that: baseline_ssh_allowed_cidrs | default([]) | length > 0
        fail_msg: "baseline_ssh_allowed_cidrs is empty - enabling ufw would lock this SSH session out."
      when: ansible_connection | default('ssh') not in ['local']

  roles:
    - role: baseline_hardening
    - role: rsyslog_collector

  post_tasks:
    - name: Verify TCP listeners are up
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 30
      loop: "{{ [rsyslog_tcp_port] + ([rsyslog_tls_port] if rsyslog_tls_enabled else []) }}"

    - name: Verify UDP listener is up
      ansible.builtin.shell: "set -o pipefail && ss -Hlun 'sport = :{{ rsyslog_udp_port }}' | grep -q ."
      args:
        executable: /bin/bash
      changed_when: false
