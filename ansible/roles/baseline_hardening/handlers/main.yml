---
- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted
