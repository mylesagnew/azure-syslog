---
# CIS-inspired Ubuntu 26.04 LTS baseline, tuned for an Azure VM reached via Bastion.

baseline_packages_present:
  - auditd
  - ufw
  - unattended-upgrades
  - needrestart
  - apparmor-utils

baseline_packages_absent:
  - telnet
  - inetutils-telnet
  - rsh-client
  - talk
  - ftp
  - tnftp
  - nis

# Disabled only if present on the image.
baseline_services_disabled:
  - avahi-daemon.service
  - cups.service
  - rpcbind.service
  - ModemManager.service
  - bluetooth.service

# udf is deliberately NOT listed: Azure provisioning media is UDF.
# squashfs is NOT listed: snaps depend on it.
baseline_kernel_modules_blacklist:
  - cramfs
  - freevxfs
  - hfs
  - hfsplus
  - jffs2
  - usb-storage
  - dccp
  - sctp
  - rds
  - tipc

baseline_sysctl:
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.tcp_syncookies: 1
  net.ipv4.ip_forward: 0
  net.ipv6.conf.all.accept_redirects: 0
  net.ipv6.conf.default.accept_redirects: 0
  kernel.randomize_va_space: 2
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  kernel.yama.ptrace_scope: 1
  fs.suid_dumpable: 0
  fs.protected_hardlinks: 1
  fs.protected_symlinks: 1

# SSH - only Bastion (plus explicit admin ranges) can reach port 22.
baseline_ssh_allowed_cidrs: []
baseline_ssh_port: 22
baseline_ssh_allow_groups: []   # e.g. ["sudo"]; empty = no AllowGroups line
baseline_ssh_max_auth_tries: 3
baseline_ssh_client_alive_interval: 300
baseline_ssh_client_alive_count_max: 2
# OpenSSH 10.x on 26.04: hybrid post-quantum ML-KEM first.
baseline_ssh_kex:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
baseline_ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
# Non-ETM SHA-2 MACs kept for Azure Bastion compatibility.
baseline_ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256

baseline_banner: "Authorised access only. Activity on this system is logged and monitored."

# Unattended upgrades
baseline_unattended_reboot: false
baseline_unattended_reboot_time: "03:30"

# journald - local logs of the collector itself
baseline_journald_max_use: 1G

baseline_auditd_enabled: true
