---
# Ubuntu 24.04 uses socket activation; sshd -t needs the privsep dir.
- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ baseline_banner }}\n"
    owner: root
    group: root
    mode: "0644"

# 10- sorts before cloud-init's 50-cloudimg-settings.conf; first match wins.
- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Validate full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
