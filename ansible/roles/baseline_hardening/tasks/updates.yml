---
- name: Enable periodic apt updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    owner: root
    group: root
    mode: "0644"

- name: Unattended-upgrades local policy (security pocket stays the default)
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

- name: Restart services automatically after library updates
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/60-baseline.conf
    content: |
      # Managed by Ansible
      $nrconf{restart} = 'a';
    owner: root
    group: root
    mode: "0644"

- name: Ensure unattended-upgrades is running
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
